services:
  mysql:
    image: mysql:9
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: combined
    ports:
      - 3306:3306
    volumes:
      - ./tests/fixtures:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible stand-in for DigitalOcean Spaces, used to exercise the
  # event banner upload path end-to-end without touching real Spaces. The
  # official minio/minio image ships no shell utilities to health-check
  # with, so readiness is proven by minio-init actually reaching the API
  # (mithril depends on its completion, not on a minio healthcheck).
  minio:
    image: minio/minio:latest
    restart: "no"
    command: server /data
    environment:
      MINIO_ROOT_USER: mithril-test
      MINIO_ROOT_PASSWORD: mithril-test-secret
    ports:
      - 9000:9000

  # One-shot: wait for minio's API and create the test bucket.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 mithril-test mithril-test-secret; do sleep 1; done;
      mc mb --ignore-existing local/vatusa-events-test;
      "
    depends_on:
      - minio

  mithril:
    image: localhost/mithril:latest
    restart: "no"
    environment:
      DATABASE_URL_VATUSA: mysql://root:password@mysql/combined?ssl-mode=disabled
      DATABASE_URL_COBALT: mysql://root:password@mysql/combined?ssl-mode=disabled
      DO_SPACES_KEY: mithril-test
      DO_SPACES_SECRET: mithril-test-secret
      DO_SPACES_BUCKET: vatusa-events-test
      DO_SPACES_REGION: us-east-1
      DO_SPACES_ENDPOINT: http://minio:9000
      DO_SPACES_PUBLIC_BASE_URL: http://localhost:9000/vatusa-events-test
      DO_SPACES_PATH_STYLE: "true"
    ports:
      - 4000:4000
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
