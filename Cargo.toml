[package]
name = "mithril"
version = "0.1.0"
edition = "2024"
authors = []
description = "VATUSA HTTP API"
readme = "README.md"
homepage = "https://github.com/vatusa/mithril"
repository = "https://github.com/vatusa/mithril"
documentation = ""
license-file = "LICENSE.md"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
dotenv = "0.15.0"
http = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "mysql", "macros", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.0.7"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["timeout", "trace"] }
tower-sessions = "0.15.0"
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.4.0", features = ["chrono"] }
utoipa-axum = "0.2.0"
utoipa-redoc = { version = "6.0.0", features = ["axum"] }
