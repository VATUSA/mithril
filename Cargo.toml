[package]
name = "mithril"
version = "0.1.0"
edition = "2024"
authors = ["VATUSA Web Team"]
description = "VATUSA HTTP API"
readme = "README.md"
homepage = "https://github.com/vatusa/mithril"
repository = "https://github.com/vatusa/mithril"
documentation = ""
license-file = "LICENSE.md"

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.4.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
rust-s3 = { version = "0.37.2", default-features = false, features = ["tokio-rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
# tls-rustls is required to reach Azure Database for MySQL, which sets
# require_secure_transport=ON. Without a TLS feature sqlx fails any encrypted
# connection with "TLS upgrade required by connect options but SQLx was built
# without TLS support enabled". It resolves to rustls-ring with webpki-roots, so
# the trust anchors are compiled in rather than read from the image, and rustls
# is already in this tree via reqwest and rust-s3.
#
# Note this changes sqlx's effective default ssl-mode from Disabled (no TLS
# compiled) to Preferred, so db.rs pins it back explicitly. See connect_options.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "mysql", "macros", "chrono", "mysql-rsa", "json", "tls-rustls"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.0.7"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["timeout", "trace"] }
tower-sessions = "0.15.0"
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["chrono"] }
utoipa-axum = "0.2.0"
utoipa-redoc = { version = "6.0.0", features = ["axum"] }

[dev-dependencies]
rusty-hook = "^0.11.2"
